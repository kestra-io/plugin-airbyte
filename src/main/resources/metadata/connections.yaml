group: io.kestra.plugin.airbyte.connections
name: "connections"
title: "Airbyte Connections"
description: "Tasks that start and monitor sync jobs and reset streams on a self-hosted Airbyte instance"
body: "Use these tasks to trigger a connection sync, reset streams of a connection, and optionally wait for the Airbyte job to finish. Set `url` and the required connection or job ID, then configure one supported authentication method such as basic auth, a bearer token, or application credentials."
